services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - ./data:/data
    environment:
      # Database Configuration
      - BADGER_PATH=/data/badger-dev
      - BADGER_IN_MEMORY=false
      
      # Server Configuration
      - PORT=8080
      - DEBUG=true
      
      # Legacy scraper settings (for existing functionality)
      - SCRAPE_INTERVAL=300
      - USE_PARALLEL_SCRAPER=true
      
      # Tracker Configuration (Development)
      - TRACKER_ENABLED=true
      - TRACKER_DEVELOPMENT=true
      - TRACKER_SCAN_INTERVAL=5m
      - TRACKER_MAX_WORKERS=2
      - TRACKER_TIMEOUT=30s
      - TRACKER_ENABLE_NOTIFICATIONS=false
      
      # Scraper Configuration
      - TRACKER_HEADLESS=true
      - TRACKER_SCRAPER_TIMEOUT=30s
      - TRACKER_USER_AGENT=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36
      
      # Discord Configuration (disabled for development)
      - DISCORD_USERNAME=Pokemon Card Tracker (Dev)
      - DISCORD_TIMEOUT=10s
      
      # Chrome Configuration for Docker
      - CHROME_BIN=/usr/bin/chromium-browser
      - CHROME_PATH=/usr/bin/chromium-browser
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: development
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - BACKEND_URL=http://backend:8080
      - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
    driver: local 