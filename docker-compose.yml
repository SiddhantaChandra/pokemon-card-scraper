services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # Database Configuration
      - BADGER_PATH=/data/badger
      - BADGER_IN_MEMORY=false
      
      # Server Configuration
      - PORT=8080
      - DEBUG=false
      
      # Legacy scraper settings (for existing functionality)
      - SCRAPE_INTERVAL=300
      - USE_PARALLEL_SCRAPER=true
      
      # Tracker Configuration (Debug - 30 second intervals)
      - TRACKER_ENABLED=true
      - TRACKER_DEVELOPMENT=true
      - TRACKER_SCAN_INTERVAL=30s
      - TRACKER_MAX_WORKERS=2
      - TRACKER_TIMEOUT=30s
      - TRACKER_ENABLE_NOTIFICATIONS=true
      
      # Scraper Configuration
      - TRACKER_HEADLESS=true
      - TRACKER_SCRAPER_TIMEOUT=60s
      - TRACKER_USER_AGENT=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36
      
      # Discord Configuration (optional - set your webhook URL)
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/1386967025133555783/VnEE5VJaBStnEQKElqk3E1qwxh7PKGAdrtRTD5WkBt268sADrsBFtIazWBCTRPbEAfzt
      - DISCORD_USERNAME=Pokemon Card Tracker
      - DISCORD_TIMEOUT=15s
      
      # Chrome Configuration for Docker
      - CHROME_BIN=/usr/bin/chromium-browser
      - CHROME_PATH=/usr/bin/chromium-browser
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: production
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - BACKEND_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
    driver: local 