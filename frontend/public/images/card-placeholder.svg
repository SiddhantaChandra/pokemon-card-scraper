<svg width="300" height="400" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="400" rx="12" fill="#F3F4F6"/>
  <rect x="20" y="20" width="260" height="200" rx="8" fill="#E5E7EB"/>
  
  <!-- Pokemon card outline -->
  <rect x="30" y="30" width="240" height="180" rx="6" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Card icon -->
  <circle cx="150" cy="120" r="30" fill="#6B7280"/>
  <path d="M135 105 L165 120 L135 135 Z" fill="#F3F4F6"/>
  
  <!-- Text lines -->
  <rect x="30" y="240" width="200" height="12" rx="6" fill="#D1D5DB"/>
  <rect x="30" y="260" width="160" height="12" rx="6" fill="#D1D5DB"/>
  <rect x="30" y="280" width="120" height="12" rx="6" fill="#D1D5DB"/>
  
  <!-- Price placeholder -->
  <rect x="30" y="320" width="80" height="20" rx="10" fill="#FEE2E2"/>
  <rect x="35" y="325" width="70" height="10" rx="5" fill="#DC2626"/>
  
  <!-- Pokemon text -->
  <text x="150" y="360" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Pokemon Card</text>
  <text x="150" y="380" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="12">Image not available</text>
</svg> 